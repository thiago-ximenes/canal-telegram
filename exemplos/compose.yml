# Tres servicos independentes: o canal, e os dois de audio que ele usa se existirem.
# O token mora SO no container do canal -- o agente, que roda ao lado, nunca o ve.
services:
  canal:
    build: ..                         # o Dockerfile na raiz do repo
    image: canal-telegram:local
    container_name: canal-telegram
    restart: unless-stopped
    networks: [canal]
    environment:
      CANAL_DIR: /estado
      CANAL_NOME: canal
      CANAL_COMANDOS: /comandos/comandos.cjs   # opcional
      FALA: http://fala:8080
      TRANSCRITOR: http://transcreve:8080
    volumes:
      - ./estado:/estado                  # telegram.json {token, chat} + respostas/
      - ./comandos:/comandos:ro           # opcional, e so isto fica fora da imagem
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    init: true

  # Seu agente: ve a MESMA pasta como /entrada, e so. Sem token, sem rede do bot.
  agente:
    image: node:24-alpine
    container_name: agente
    restart: unless-stopped
    networks: [canal]
    command: node /app/agente.cjs
    volumes:
      - ./agente:/app:ro
      - ./estado/respostas:/entrada
    init: true

  transcreve:
    build: ../servicos/transcreve
    image: transcreve:local
    container_name: transcreve
    restart: unless-stopped
    networks: [canal]
    # O modelo (487 MB) fica fora da imagem para nao ser rebaixado a cada rebuild.
    volumes: [./modelos:/modelos:ro]
    environment:
      MODELO: /modelos/ggml-small.bin
      IDIOMA: pt
      THREADS: "4"
      VOCABULARIO: "Node, TypeScript, Postgres, deploy, pull request."
    read_only: true
    tmpfs: [/tmp:size=256m]
    mem_limit: 2g
    security_opt: [no-new-privileges:true]
    init: true

  fala:
    build: ../servicos/fala
    image: fala:local
    container_name: fala
    restart: unless-stopped
    networks: [canal]
    environment:
      VOZ: pt-BR-AntonioNeural
    read_only: true
    tmpfs: [/tmp:size=256m]
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    init: true

networks:
  canal:
